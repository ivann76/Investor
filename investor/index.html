<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7f9">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Portfolio">
<title>My Portfolio</title>
<style>
:root{color-scheme:light dark;--bg:#f4f7f9;--card:#fff;--ink:#0b3c57;--mut:#7a8c97;--line:#e6ecef;--acc:#00806c;--onacc:#fff;--up:#12a05c;--dn:#e5484d;--sh:0 6px 20px rgba(11,60,87,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1a22;--card:#12262f;--ink:#e6f1f5;--mut:#8aa3ae;--line:#1f3943;--acc:#2fd0b3;--onacc:#06201a;--up:#3ddc91;--dn:#ff7b80;--sh:none}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:14px 18px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}.top img{width:38px;height:38px}.top b{flex:1;font-size:1.05rem}
h2{font-size:1.25rem;margin:4px 0 2px}h3{font-size:1rem;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline}h3 a{font-size:.8rem;font-weight:400;color:var(--mut)}
.sub{font-size:.8rem;color:var(--mut);margin-bottom:14px}
.card{background:var(--card);border-radius:20px;padding:6px 16px;box-shadow:var(--sh);border:1px solid var(--line)}
.hero{padding:18px 18px 16px}.hero .big{font-size:2.3rem;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}.sm{font-size:.8rem}.r{text-align:right}
.bars{display:flex;align-items:flex-end;justify-content:space-around;gap:8px;height:215px;padding:14px 8px 14px}
.bc{flex:1;max-width:84px;text-align:center}.bc b{font-size:1rem;display:block}.bc i{font-style:normal;font-size:.7rem;color:var(--mut);display:block;margin-bottom:4px}
.bar{border-radius:14px;color:#fff;font-size:.72rem;font-weight:600;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;overflow:hidden}
.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.st{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.st:last-child{border:0}
.av{width:44px;height:44px;border-radius:50%;color:#fff;font-weight:700;font-size:.85rem;display:grid;place-items:center;flex:none}
.nm{flex:1;min-width:0}.nm b{display:block}.st svg{flex:none}.st .r{min-width:112px}
label{display:block;font-size:.82rem;color:var(--mut);margin:14px 0 5px}
input,select,textarea,button{font:inherit;color:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
button{background:var(--acc);color:var(--onacc);border:0;font-weight:600;margin-top:16px;padding:14px;border-radius:14px}
button.g{background:none;color:var(--acc);border:1px solid var(--line);margin-top:10px}
button.x{width:auto;padding:5px 12px;margin:0;background:none;color:var(--dn);border:1px solid var(--line);border-radius:10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
nav button{margin:0;background:none;color:var(--mut);padding:10px 0;font-size:.78rem;font-weight:500;border-radius:12px}
nav button.on{color:var(--acc);font-weight:700;background:color-mix(in srgb,var(--acc) 12%,transparent)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;width:auto}.seg button{margin:0;padding:5px 12px;width:auto;background:none;color:var(--mut);font-size:.8rem;border-radius:9px}.seg button.on{background:var(--acc);color:var(--onacc)}
.err{color:var(--dn);font-size:.85rem;min-height:1.2em;margin-top:8px}.empty{padding:22px 4px;color:var(--mut);text-align:center}
</style></head><body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
let S={txs:[],key:'',rate:null,prices:{},hist:{},ccy:'MYR'},view='home',msg='';
try{Object.assign(S,JSON.parse(localStorage.getItem('pf')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('pf',JSON.stringify(S))}catch(e){}};
const f=(n,d=2)=>n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const sg=(n,d=2)=>(n<0?'\u2212':'+')+f(Math.abs(n),d);
const cl=n=>n>=0?'up':'dn';
const today=()=>new Date().toISOString().slice(0,10);

function calc(){
  const txs=[...S.txs].sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id),r=S.rate||0;
  const pos={};let cashM=0,cashU=0,depM=0;
  for(const t of txs){
    if(t.type==='deposit'||t.type==='withdraw'){
      const s=t.type==='deposit'?1:-1;
      if(t.usd!=null){cashU+=s*t.usd;depM+=s*(t.myr!=null?t.myr:t.usd*(t.rate||r))}
      else{cashM+=s*t.myr;depM+=s*t.myr}
    }else if(t.type==='dividend'){cashU+=t.usd}
    else{
      const p=pos[t.t]||(pos[t.t]={q:0,c:0,cm:0});
      if(t.type==='buy'){
        const c=t.q*t.p+t.fee,cm=t.myr!=null?t.myr:c*(t.rate||r);
        p.q+=t.q;p.c+=c;p.cm+=cm;
        if(t.paid==='myr')cashM-=cm;else cashU-=c;
      }else{
        const q=Math.min(t.q,p.q),avg=p.q?p.c/p.q:0,fr=p.q?q/p.q:0,pr=t.q*t.p-t.fee;
        p.cm-=p.cm*fr;p.q-=q;p.c-=avg*q;
        if(t.recv==='myr')cashM+=t.myr!=null?t.myr:pr*(t.rate||r);else cashU+=pr;
      }
    }
  }
  const hold=Object.entries(pos).filter(([,p])=>p.q>1e-9).map(([t,p])=>{
    const pr=S.prices[t],price=pr?pr.p:p.c/p.q,val=p.q*price,d=pr&&pr.d?pr.d:0;
    let v=(S.hist[t]||[]).map(x=>x[1]);if(v.length<2&&pr&&pr.d)v=[pr.p-pr.d,pr.p];
    const usdPct=(val/p.c-1)*100;
    return{t,q:p.q,avg:p.c/p.q,price,live:!!pr,val,pl:val-p.c,pct:usdPct,plM:val*r-p.cm,pctM:p.cm>0&&r?(val*r/p.cm-1)*100:usdPct,day:p.q*d,dp:pr&&pr.dp?pr.dp:0,v};
  }).sort((a,b)=>b.val-a.val);
  return{cashM,cashU,depM,hold,inv:hold.reduce((a,h)=>a+h.val,0),day:hold.reduce((a,h)=>a+h.day,0)};
}
function spark(v,up){
  if(!v||v.length<2)return'<svg width="76" height="30"></svg>';
  const mn=Math.min(...v),mx=Math.max(...v),rg=mx-mn||1;
  const pts=v.map((y,i)=>(i/(v.length-1)*74+1).toFixed(1)+','+(27-(y-mn)/rg*24).toFixed(1)).join(' ');
  return`<svg width="76" height="30"><polyline points="${pts}" fill="none" stroke="var(--${up?'up':'dn'})" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function rows(list,k,cy,m){
  return list.map(x=>{const hue=[...x.t].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360,pl=m?x.plM:x.pl,pc=m?x.pctM:x.pct;
    return`<div class="st"><div class="av" style="background:hsl(${hue} 50% 42%)">${x.t.slice(0,2)}</div>
    <div class="nm"><b>${x.t}</b><span class="mut sm">${f(x.q,x.q%1?4:0)} sh &middot; avg $${f(x.avg)}</span></div>${spark(x.v,x.day>=0)}
    <div class="r"><b>${cy}${f(x.val*k)}</b><div class="sm ${cl(x.day)}">${x.live?`${x.day>=0?'\u25B2':'\u25BC'} ${sg(x.dp)}%`:'no price yet'}</div><div class="sm ${cl(pl)}">P/L ${sg(pl)} (${sg(pc)}%)</div></div></div>`}).join('');
}
function bars(hold,m){
  const l=hold.slice(0,5),pcs=l.map(x=>m?x.pctM:x.pct),mx=Math.max(...pcs.map(Math.abs),1),k=m?S.rate:1,cy=m?'RM ':'$';
  return l.map((x,i)=>{const pc=pcs[i],hh=Math.round(52+Math.abs(pc)/mx*98),n=l.length,hue=Math.round(215-(n>1?i/(n-1):0)*65);
    const bg=pc>=0?`linear-gradient(165deg,hsl(${hue} 70% 62%),hsl(${hue-12} 60% 52%))`:'linear-gradient(165deg,#ff9a8b,#e5484d)';
    return`<div class="bc"><b>${sg(pc,1)}%</b><i>${cy}${f(x.val*k,0)}</i><div class="bar" style="height:${hh}px;background:${bg}">${x.t}</div></div>`}).join('');
}


function render(){
  const c=calc(),r=S.rate||0,m=S.ccy==='MYR'&&r,k=m?r:1,cy=m?'RM ':'$';
  const cashS=m?c.cashM+c.cashU*r:(r?c.cashM/r+c.cashU:c.cashU),total=cashS+c.inv*k,dep=m?c.depM:(r?c.depM/r:0);
  const pl=total-dep,pct=dep>0?pl/dep*100:0,neg=c.cashM<-0.005||c.cashU<-0.005;
  const live=Object.values(S.prices).map(p=>p.ts).filter(Boolean),asof=live.length?'Prices as of '+new Date(Math.max(...live)).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'No prices loaded yet';
  let h='';
  if(view==='home'){
    h=`<div class="top"><img src="logo.png" alt=""><b>My Portfolio</b><div class="seg"><button class="${m?'on':''}" onclick="ccy('MYR')">MYR</button><button class="${m?'':'on'}" onclick="ccy('USD')">USD</button></div></div>
    <h2>Total money</h2><div class="sub">${asof}${S.rate?` &middot; 1 USD = ${f(S.rate,4)} MYR`:''}</div>
    <div class="card hero"><div class="big">${cy}${f(total)}</div>
    <div class="${cl(pl)}"><b>${sg(pl)} (${sg(pct)}%)</b> <span class="mut sm">all-time P/L</span></div>
    ${c.hold.some(x=>x.live)?`<div class="sm ${cl(c.day)}" style="margin-top:4px">Today ${sg(c.day*k)}</div>`:''}</div>
    <h3>Return by stock</h3>
    <div class="card">${c.hold.length?`<div class="bars">${bars(c.hold,m)}</div>`:'<div class="empty">Add a deposit and a buy to see your stocks here.</div>'}</div>
    <h3>Where your money is</h3>
    <div class="card"><div class="row"><span>Invested in stocks</span><b>${cy}${f(c.inv*k)}</b></div>
    <div class="row"><span>Cash, not invested<span class="mut sm">${c.cashU>0.005?` (incl. $${f(c.cashU)} USD)`:''}</span></span><b class="${neg?'dn':''}">${cy}${f(cashS)}</b></div>
    <div class="row"><span>Money put in (net)</span><b>${cy}${f(dep)}</b></div></div>
    ${neg?'<p class="dn sm">Cash is negative: add a deposit to match your buys.</p>':''}${S.key?'':'<p class="mut sm">Add a Finnhub key in Settings to load stock prices.</p>'}
    ${c.hold.length?`<h3>Your stocks <a href="#" onclick="go('hold');return false">See all</a></h3><div class="card">${rows(c.hold.slice(0,3),k,cy,m)}</div>`:''}
    <button class="g" onclick="refresh()">Refresh prices</button><div class="mut sm" style="margin-top:8px;text-align:center">${msg}</div>`;
  }else if(view==='hold'){
    h=`<h2>Your stocks</h2><div class="sub">${asof}</div>`+(c.hold.length?`<div class="card">${rows(c.hold,k,cy,m)}</div>`:'<div class="card empty">No stocks yet. Add a deposit, then a buy.</div>');
  }else if(view==='add'){
    h=`<h2>Add transaction</h2><label>Type</label><select id="ty" onchange="tog()"><option value="deposit">Deposit (MYR in)</option><option value="withdraw">Withdraw (MYR out)</option><option value="buy">Buy</option><option value="sell">Sell</option><option value="dividend">Dividend</option></select>
    <label>Date</label><input id="dt" type="date" value="${today()}">
    <div data-f="buy sell dividend"><label>Ticker (e.g. AAPL)</label><input id="tk" autocapitalize="characters"></div>
    <div data-f="buy sell"><label>Shares (decimals OK)</label><input id="q" inputmode="decimal"><label>Price per share (USD)</label><input id="pr" inputmode="decimal"><label>Fees (USD)</label><input id="fee" inputmode="decimal" placeholder="0"></div>
    <div data-f="buy"><label>Paid with</label><select id="pw" onchange="tog()"><option value="myr">MYR, converted when buying</option><option value="usd">USD cash already in my account</option></select></div>
    <div data-f="sell"><label>Proceeds</label><select id="rw" onchange="tog()"><option value="usd">Stay as USD cash</option><option value="myr">Converted back to MYR</option></select></div>
    <div id="wm"><label id="lm"></label><input id="myr" inputmode="decimal"></div>
    <div data-f="dividend"><label>Amount (USD)</label><input id="usd" inputmode="decimal"></div>
    <div class="err" id="er"></div><button onclick="addTx()">Save transaction</button>`;
  }else if(view==='hist'){
    const l=[...S.txs].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
    h=`<h2>History</h2><div class="sub">Newest first</div>`+(l.length?`<div class="card">`+l.map(t=>{
      const d=t.type==='buy'||t.type==='sell'?`${t.t} ${f(t.q,t.q%1?4:0)} @ ${f(t.p)}${t.fee?' + fee '+f(t.fee):''}${t.myr!=null?' &middot; RM '+f(t.myr):''}${t.type==='buy'&&t.paid!=='myr'?' &middot; from USD cash':''}`:(t.usd!=null?`${t.t?t.t+' ':''}$${f(t.usd)}${t.myr!=null?' (RM '+f(t.myr)+')':''}`:`RM ${f(t.myr)}`);
      return`<div class="row"><div><b>${t.type}</b> <span class="mut sm">${t.date}</span><div class="sm">${d}</div></div><button class="x" onclick="del(${t.id})">Delete</button></div>`}).join('')+`</div><p class="mut sm">To fix a mistake, delete it and add it again.</p>`:`<div class="card empty">Nothing yet.</div>`);
  }else{
    h=`<h2>Settings</h2><label>Finnhub API key (free at finnhub.io)</label><input id="key" value="${S.key}" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label>USD to MYR rate (fills in automatically, edit if needed)</label><input id="rt" inputmode="decimal" value="${S.rate||''}">
    <button onclick="setS()">Save settings</button>
    <label style="margin-top:26px">Backup: copy this text somewhere safe. To restore, paste it here and tap Restore.</label>
    <textarea id="bk" rows="5">${JSON.stringify(S.txs)}</textarea><button class="g" onclick="restore()">Restore from text</button><div class="err" id="er"></div>`;
  }
  $('#app').innerHTML=h;
  $('#nav').innerHTML=[['home','Home'],['hold','Stocks'],['add','Add'],['hist','History'],['set','Settings']].map(([v,n])=>`<button class="${view===v?'on':''}" onclick="go('${v}')">${n}</button>`).join('');
  if(view==='add')tog();
}
function go(v){view=v;render();scrollTo(0,0)}
function ccy(c){S.ccy=c;save();render()}
function tog(){
  const t=$('#ty').value;document.querySelectorAll('[data-f]').forEach(d=>d.style.display=d.dataset.f.split(' ').includes(t)?'':'none');
  let show=false,lab='';
  if(t==='deposit'||t==='withdraw'){show=true;lab='Amount (MYR)'}
  else if(t==='buy'&&$('#pw').value==='myr'){show=true;lab='MYR charged by your broker (blank = estimate at today\u2019s rate)'}
  else if(t==='sell'&&$('#rw').value==='myr'){show=true;lab='MYR received (blank = estimate at today\u2019s rate)'}
  $('#wm').style.display=show?'':'none';$('#lm').textContent=lab;
}
function err(t){$('#er').textContent=t}
function addTx(){
  const g=i=>$('#'+i).value.trim(),n=i=>parseFloat(g(i)),ty=g('ty'),t={id:Date.now(),type:ty,date:g('dt')||today()},my=n('myr');
  if(ty==='deposit'||ty==='withdraw'){if(!(my>0))return err('Enter the MYR amount.');t.myr=my}
  else{
    t.t=g('tk').toUpperCase().replace(/[^A-Z.\-]/g,'');if(!t.t)return err('Enter a ticker.');
    if(ty==='dividend'){t.usd=n('usd');if(!(t.usd>0))return err('Enter the USD amount.')}
    else{
      t.q=n('q');t.p=n('pr');t.fee=n('fee')||0;if(!(t.q>0&&t.p>0))return err('Enter shares and price.');
      t.rate=S.rate||0;const inMyr=ty==='buy'?g('pw')==='myr':g('rw')==='myr';
      if(ty==='buy')t.paid=g('pw');else t.recv=g('rw');
      if(inMyr){if(my>0)t.myr=my;else if(!t.rate)return err('Exchange rate not loaded yet. Enter the MYR amount.')}
    }
  }
  S.txs.push(t);save();view='home';render();refresh();
}
function del(id){if(confirm('Delete this transaction?')){S.txs=S.txs.filter(t=>t.id!==id);save();render()}}
function setS(){S.key=$('#key').value.trim();const r=parseFloat($('#rt').value);if(r>0)S.rate=r;save();view='home';render();refresh()}
function restore(){try{const a=JSON.parse($('#bk').value);if(!Array.isArray(a))throw 0;if(!confirm('Replace all current transactions with this backup?'))return;S.txs=a;save();view='home';render();refresh()}catch(e){err('That text is not a valid backup.')}}
async function refresh(){
  msg='Updating\u2026';if(view==='home')render();
  const bad=[];
  try{const j=await(await fetch('https://api.frankfurter.dev/v1/latest?base=USD&symbols=MYR')).json();if(j.rates&&j.rates.MYR)S.rate=j.rates.MYR}catch(e){bad.push('exchange rate')}
  if(S.key){
    const ts=[...new Set(S.txs.filter(t=>t.t).map(t=>t.t))];
    await Promise.all(ts.map(async s=>{try{
      const j=await(await fetch('https://finnhub.io/api/v1/quote?symbol='+encodeURIComponent(s)+'&token='+encodeURIComponent(S.key))).json();
      const p=j.c||j.pc;if(!p){bad.push(s);return}
      S.prices[s]={p,d:j.c?j.d||0:0,dp:j.c?j.dp||0:0,ts:Date.now()};
      const h=S.hist[s]||(S.hist[s]=[]),day=today();
      if(h.length&&h[h.length-1][0]===day)h[h.length-1][1]=p;else h.push([day,p]);
      if(h.length>30)h.shift();
    }catch(e){bad.push(s)}}));
  }
  save();msg=bad.length?'Could not update: '+bad.join(', ')+'. Showing last saved values.':'Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});render();
}
render();refresh();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
